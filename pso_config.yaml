project: Agricultural Rainfall Suitability Prediction System using PSO
author: Sagnik Patra
dataset_path: C:\Users\NXTWAVE\Downloads\Agricultural Rainfall Suitability Prediction
  System\DailyRainfallDataRaigadMaharashtra.csv
base_directory: C:\Users\NXTWAVE\Downloads\Agricultural Rainfall Suitability Prediction
  System
prefix: pso_
optimization:
  algorithm: Particle Swarm Optimization
  num_particles: 20
  generations: 30
  inertia_weight: 0.7
  cognitive_coeff: 1.5
  social_coeff: 1.5
models:
  random_forest:
    n_estimators: 300
    max_depth: 10
    random_state: 42
  neural_network:
    epochs: 100
    batch_size: 8
    optimizer: adam
    loss: categorical_crossentropy
selected_features:
- Progressive (m.m)
- Month
- Rainfall_Lag_1
- Weekly_Rainfall
classes:
- Low Water Crops Suitable
- Pulses Suitable
- Rice Suitable
- Sugarcane Suitable
